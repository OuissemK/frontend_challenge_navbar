<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- Meta SEO -->
    <meta name="description" content="Responsive fullscreen navigation menu built with HTML and CSS. UI challenge focused on layout structure, hover transitions, typography hierarchy and clean design system architecture.">

<!-- Meta Color-Theme -->
    <meta name="theme-color" content="#a3a39b">

<!-- Links Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant:wght@300;400&family=Manrope:wght@500;700;800&family=Caveat:wght@400&display=swap" rel="stylesheet">

<!-- Links CSS -->
    <link rel="stylesheet" href="./css/tokens.css">
    <link rel="stylesheet" href="./css/full_screen.css">

    <title>Responsive Fullscreen Navbar with Hover Effects</title>
</head>
<body>
<!-- NavBar -->
    <header class="navbar">
        <div class="logo"></div>
        <button type="button" class="menu-toggle" aria-expanded="false" aria-pressed="false" aria-controls="main-menu">
            <span>+</span>
            <span>Menu</span>
        </button>
    </header>

<!-- Section Main Menu -->
    <section class="main-menu" id="main-menu">
        <div class="wrapper__main-menu">
            <div class="toggles">
                <button type="button" class="toggle__lang">Fr</button>
                <span>/</span>
                <button type="button" class="toggle__lang">En</button>
            </div>
            <p class="brand">Freshman</p>
            <button type="button" class="close__toggle">
                <span>x</span>
                <span>Fermer</span>
            </button>
        </div>

<!-- Main Menu Nav -->
        <nav class="main__menu">
            <ul class="nav__items">
                <li><a href="#">Accueil</a></li>
                <li><a href="#">Projet <span class="nav__count">(39)</span></a></li>
                <li><a href="#">Réalisateurs•trices <span class="nav__count">(12)</span></a></li>
                <li><a href="#">À propos</a></li>
                <li><a href="#">À la une <span class="nav__count">(11)</span></a></li>
                <li><a href="#">Nous contacter</a></li>
            </ul>
            <div class="footer__main-menu">
                <ul class="footer__items-left">
                    <li><a href="#">
                        <span>(confidentialité)</span>
                        <span>Politique de confidentialité</span>
                    </a></li>
                </ul>
                <span class="copyright">2026© Le vrai l'emporte toujours</span>
                <ul class="footer__items-right">
                    <li><a href="#">
                        <span>(conditions)</span>
                        <span>Conditions</span>
                    </a></li>
                </ul>
            </div>
        </nav>
    </section>

<!-- Js Script -->
    <script src="./js/full_screen.js"></script>
</body>
</html>
